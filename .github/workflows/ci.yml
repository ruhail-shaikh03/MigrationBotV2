name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrationbot
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migrationbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrationbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Matches backend/Dockerfile's base image (python:3.12-slim) so CI catches
      # anything that would only break on the version actually deployed.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.16.1

      - name: Lint (ruff)
        run: ruff check backend/app

      # The only place the migration chain can be executed at all: there is no Docker and
      # no Postgres on the maintainer's machine, so `alembic upgrade head` is unrunnable
      # locally and would otherwise first execute against the production database.
      #
      # `alembic check` is the part that earns its keep. It diffs the migrated schema
      # against app.models and fails if they disagree, which is what proves the hand-written
      # baseline actually matches the models it claims to reproduce — a transcription slip
      # in 0001_baseline is invisible to the test suite (which builds its schema with
      # create_all, not Alembic) and would surface only as a missing column in production.
      - name: Verify migrations (upgrade from empty, then diff against models)
        env:
          DATABASE_URL: postgresql+asyncpg://migrationbot:test@localhost:5432/migrationbot_test
          REDIS_URL: redis://localhost:6379
          DEEPSEEK_API_KEY: mock-key
          JWT_SECRET: test-secret-32-characters-long-xx
          CORS_ORIGINS: "http://localhost:3000"
          ADMIN_EMAILS: "admin@example.com"
          DEFAULT_SPREADSHEET_ID: "test-spreadsheet-id"
        run: |
          cd backend
          alembic upgrade head
          alembic check
          # Prove the down path too, so a bad downgrade is caught here rather than during
          # an incident, and leave the database empty for the test suite's own create_all.
          alembic downgrade base

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://migrationbot:test@localhost:5432/migrationbot_test
          REDIS_URL: redis://localhost:6379
          DEEPSEEK_API_KEY: mock-key
          JWT_SECRET: test-secret-32-characters-long-xx
          CORS_ORIGINS: "http://localhost:3000"
          ADMIN_EMAILS: "admin@example.com"
          DEFAULT_SPREADSHEET_ID: "test-spreadsheet-id"
        run: |
          cd backend
          pip install pytest-cov==7.0.0
          pytest -v --tb=short --cov=app --cov-report=term-missing
          # No --cov-fail-under yet: this is the first run with coverage wired up at
          # all, and setting a floor blind (without having seen a real number from a
          # live run against this DB/Redis) would either be toothless or break CI on
          # sight. Once a baseline is visible in this job's logs, ratchet a floor in.

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (eslint)
        # Advisory only for now: the frontend has ~49 pre-existing lint errors
        # (mostly @typescript-eslint/no-explicit-any) that predate this workflow
        # change and are a real cleanup task, not a CI infra one. This makes lint
        # output visible on every run without turning every unrelated PR red.
        # Flip to blocking once that backlog is paid down.
        continue-on-error: true
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js app
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Next.js evaluates route handlers (incl. auth.ts) during "Collecting page
          # data" to build the route manifest — it's not just bundling source, so
          # auth.ts's module-level "throw if JWT_SECRET is unset" (Phase 4) fires here
          # too, not just at runtime. Dummy values only; never real secrets in CI.
          JWT_SECRET: test-secret-32-characters-long-xx
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          NEXTAUTH_SECRET: test-nextauth-secret
