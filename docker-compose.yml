version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: migrationbot-postgres
    environment:
      POSTGRES_DB: migrationbot
      POSTGRES_USER: migrationbot
      # `:?` makes compose abort with this message when the var is unset, rather than
      # substituting an empty string and bringing up a passwordless database.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` mapping. Every consumer reaches Postgres over the compose network
    # as `postgres:5432`; publishing it to the host only exposes it to the internet.
    # Docker writes its own iptables rules that bypass UFW, so a host firewall does
    # NOT contain a published port — see TDD.md §15.1.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: migrationbot-redis
    # Defence in depth: unpublished *and* password-protected. Redis has no auth by
    # default, and an unauthenticated instance is trivially turned into RCE via
    # CONFIG SET dir/dbfilename to overwrite ~/.ssh/authorized_keys.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}"]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: migrationbot-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://migrationbot:${DB_PASSWORD}@postgres:5432/migrationbot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    # No `ports:` mapping — Caddy reverse-proxies to `backend:8000` over the compose
    # network. Publishing 8000 would put the API on the internet unauthenticated at
    # the network layer, alongside the TLS-terminated route Caddy serves.
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      # Hits GET /api/ready (Postgres + Redis probe) so a config error that crash-loops
      # the process, or a dependency that's unreachable, shows up as "unhealthy" in
      # `docker compose ps` instead of requiring someone to read the logs to notice.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build: ./backend
    container_name: migrationbot-worker
    command: python -m app.queue.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://migrationbot:${DB_PASSWORD}@postgres:5432/migrationbot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: migrationbot-frontend
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    # No `ports:` mapping — Caddy reverse-proxies to `frontend:3000`.
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: migrationbot-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
